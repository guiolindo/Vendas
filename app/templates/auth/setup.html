<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><title>Primeiro acesso · Vendas</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body><div class="auth"><form class="panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="brand"><span class="brand-mark">V</span> Vendas</div>
  <h1>Primeiro acesso</h1>
  <p class="muted" style="margin-bottom:1rem">Crie o usuário que vai usar o sistema.</p>
  {% for category, message in get_flashed_messages(with_categories=true) %}<div class="alert-box" role="alert">{{ message }}</div>{% endfor %}
  {% if need_token %}<div class="field"><label for="st">Código de instalação</label><input id="st" name="setup_token" autocomplete="off" required>
    <p class="help">É o código que foi definido ao publicar o sistema (variável VENDAS_SETUP_TOKEN).</p></div>{% endif %}
  <div class="field"><label for="n">Seu nome</label><input id="n" name="name" autofocus required></div>
  <div class="field"><label for="u">Usuário para entrar</label><input id="u" name="username" autocomplete="username" required></div>
  <div class="field"><label for="p">Senha <span class="hint">(8 ou mais, com letra e número)</span></label><input id="p" name="password" type="password" autocomplete="new-password" required></div>
  <div class="field"><label for="p2">Repita a senha</label><input id="p2" name="password2" type="password" autocomplete="new-password" required></div>
  <div class="field"><label for="biz">Nome do seu negócio <span class="hint">(opcional; aparece no comprovante)</span></label>
    <input id="biz" name="business_name" maxlength="80"></div>
  <div class="field"><label for="p1">Quem vende? <span class="hint">(opcional; pode mudar depois em Pessoas)</span></label>
    <input id="p1" name="person1" maxlength="80" placeholder="Nome da primeira pessoa" style="margin-bottom:.5rem">
    <input id="p2" name="person2" maxlength="80" placeholder="Nome da segunda pessoa"></div>
  <button class="btn primary" style="width:100%" type="submit">Criar e entrar</button>
</form></div></body></html>
